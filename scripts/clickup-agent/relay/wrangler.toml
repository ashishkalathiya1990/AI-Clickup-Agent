name = "ai-clickup-agent-clickup-relay"
main = "worker.js"
compatibility_date = "2024-11-01"

# Secrets (set with `wrangler secret put`):
#   GITHUB_PAT              fine-grained PAT scoped to ashishkalathiya1990/AI-Clickup-Agent only, contents: read+write
#   CLICKUP_WEBHOOK_SECRET  the secret returned when the webhook is created

[vars]
GITHUB_REPO = "ashishkalathiya1990/AI-Clickup-Agent"
ENABLED_HANDLERS = "tasks"
WATCHED_LIST = "1300430000066500"
AGENT_MARKER = "🤖 Clickup Agent"

# Optional — retarget the doorbell to another runtime (default: GitHub Actions; see core/runtimes/):
# DISPATCH_KIND = "gitlab"     # + GITLAB_TRIGGER_URL / GITLAB_REF vars, GITLAB_TRIGGER_TOKEN secret
# DISPATCH_KIND = "bitbucket"  # + BITBUCKET_WORKSPACE / BITBUCKET_REPO vars, BITBUCKET_TOKEN secret
#   "url" → any HTTPS job runner (DISPATCH_URL var + optional DISPATCH_TOKEN secret) — see core/runtimes/serverless/
